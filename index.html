<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<title>Apartment Life Toolkit</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #22303f;
    --muted: #7a8798;
    --line: #e8edf3;
    --brand: #12b886;
    --brand-dark: #0c8f68;
    --brand-weak: #e7f8f2;
    --danger: #e5484d;
    --radius: 16px;
    --tabh: 62px;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  body.modal-open { overflow: hidden; }
  body.dragging-now, body.dragging-now * { user-select: none !important; cursor: grabbing !important; }

  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  input, select, textarea { font: inherit; }
  [hidden] { display: none !important; }

  .app {
    max-width: 980px;
    margin: 0 auto;
    padding: 16px 14px calc(var(--tabh) + 28px + env(safe-area-inset-bottom));
  }

  .page { display: none; max-width: 620px; margin: 0 auto; }
  .page.active { display: block; }
  #page-repair.active { max-width: 960px; }

  /* ---------- 顶栏 / 语言切换 ---------- */

  .topbar { display: flex; justify-content: flex-end; margin: 0 2px 10px; }
  .lang-switch {
    display: inline-flex; align-items: center; gap: 2px;
    background: #fff; border: 1px solid var(--line);
    border-radius: 999px; padding: 3px;
    box-shadow: 0 1px 2px rgba(24, 39, 60, .05);
  }
  .lang-switch button {
    padding: 5px 14px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; color: var(--muted);
    transition: background .15s, color .15s;
  }
  .lang-switch button.on { background: var(--brand); color: #fff; }

  /* ---------- 通用组件 ---------- */

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin: 4px 2px 14px;
  }
  .page-head h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .page-head p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(24, 39, 60, .04), 0 10px 26px -20px rgba(24, 39, 60, .35);
    padding: 16px;
    margin-bottom: 14px;
  }

  .card-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border-radius: 12px;
    padding: 11px 18px;
    font-weight: 600;
    font-size: 14px;
    border: 1px solid transparent;
    transition: background .15s, border-color .15s, color .15s, transform .06s;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { background: #0fa878; }
  .btn.ghost { background: #fff; border-color: var(--line); color: #4a5768; }
  .btn.soft { background: var(--brand-weak); color: var(--brand-dark); }
  .btn.danger { color: var(--danger); border-color: #f3c6c7; background: #fff; }
  .btn.block { width: 100%; }
  .btn.sm { padding: 8px 13px; font-size: 13px; border-radius: 10px; }

  .tile {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--fc, #868e96);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex: none;
  }
  .tile.lg { width: 42px; height: 42px; border-radius: 13px; font-size: 15px; }

  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 12px; color: var(--muted); }

  .pill { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; flex: none; }
  .pill.todo { background: var(--brand-weak); color: var(--brand-dark); }
  .pill.done { background: #eef1f5; color: #8b98a8; }

  .empty { padding: 22px 8px; text-align: center; color: #9aa6b5; font-size: 13px; }
  .note-line { font-size: 12px; color: var(--muted); margin: 8px 2px; }

  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .req { color: var(--danger); margin-left: 2px; }

  .input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #fbfcfe;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
    color: inherit;
  }
  .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(18, 184, 134, .14); background: #fff; }
  .input.err { border-color: var(--danger); background: #fff7f7; }
  textarea.input { resize: vertical; min-height: 76px; line-height: 1.55; }
  select.input { appearance: none; -webkit-appearance: none; background-image: none; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    padding: 7px 13px;
    border-radius: 999px;
    background: #f2f5f8;
    color: #4a5768;
    font-size: 12.5px;
    border: 1px solid transparent;
    transition: .15s;
  }
  .chip.on { background: var(--brand-weak); color: var(--brand-dark); border-color: rgba(18, 184, 134, .4); font-weight: 600; }

  /* ---------- 底部 Tab ---------- */

  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar-inner { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 0 7px;
    color: #9aa6b5;
    font-size: 11px;
    text-decoration: none;
    transition: color .15s;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab.active { color: var(--brand); font-weight: 600; }

  /* ---------- 首页 ---------- */

  .hero {
    background: linear-gradient(135deg, #16c08b, #0ca678);
    border-radius: 18px;
    padding: 18px;
    color: #fff;
    margin-bottom: 14px;
    box-shadow: 0 12px 26px -14px rgba(12, 166, 120, .65);
  }
  .hero h1 { margin: 0 0 4px; font-size: 19px; }
  .hero p { margin: 0; font-size: 12.5px; opacity: .92; }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border-radius: 14px; padding: 12px 8px; text-align: center; box-shadow: 0 1px 2px rgba(24, 39, 60, .04); }
  .stat .v { font-size: 16.5px; font-weight: 700; }
  .stat .k { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .quick-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quick {
    background: #fff; border-radius: 16px; padding: 14px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 600;
    box-shadow: 0 1px 2px rgba(24, 39, 60, .04);
  }
  .quick .q-icon {
    width: 40px; height: 40px; border-radius: 13px;
    background: var(--brand-weak); color: var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
  }
  .quick .q-icon svg { width: 20px; height: 20px; }

  .section-title { font-size: 14px; font-weight: 700; margin: 18px 2px 10px; }

  /* ---------- 设施看板 ---------- */

  .board-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fbfcfe;
  }
  .board { display: grid; grid-template-columns: 54px repeat(7, 104px); min-width: max-content; }
  .cell { height: 62px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); position: relative; }
  .cell:nth-child(8n) { border-right: none; }
  .day-head {
    height: 46px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted);
    white-space: nowrap;
  }
  .day-head .d1 { font-weight: 700; font-size: 12.5px; color: var(--text); }
  .day-head.today .d1 { color: var(--brand); }
  .time-head {
    position: sticky; left: 0; z-index: 2;
    background: #fff;
    display: flex; justify-content: center; padding-top: 7px;
    font-size: 11px; color: #98a4b3;
  }
  .corner { position: sticky; left: 0; z-index: 2; }
  /* 用看板底色而非 transparent：sticky 需遮住横向滚动时滑过的表头单元格 */
  .table-corner-spacer { width: 54px; border: none; background: #fbfcfe; padding: 0; }
  .board-cell { padding: 3px; }
  .board-cell.hl { background: var(--brand-weak); box-shadow: inset 0 0 0 2px var(--brand); border-radius: 6px; }

  .plan {
    position: absolute;
    inset: 3px;
    border-radius: 10px;
    background: #fff;
    border-left: 3px solid var(--pc, #868e96);
    box-shadow: 0 1px 4px rgba(20, 40, 70, .16);
    padding: 5px 6px;
    display: flex; flex-direction: column; justify-content: center; gap: 1px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  .plan .p-name { font-weight: 700; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan .p-time { font-size: 10px; color: #8b98a8; }
  .plan.done { background: #f1f4f7; border-left-color: #c3ccd6; }
  .plan.done .p-name { color: #98a4b3; text-decoration: line-through; }
  .plan.dragging { opacity: .3; }
  .plan.ghost {
    position: fixed; left: 0; top: 0; right: auto; bottom: auto;
    inset: auto;
    z-index: 999;
    pointer-events: none;
    opacity: .95;
    box-shadow: 0 14px 34px rgba(20, 40, 70, .32);
    transform-origin: center;
  }

  .legend-row { display: flex; gap: 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .lg { display: flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .dot.todo { background: var(--brand); }
  .dot.done { background: #c3ccd6; }
  .lg-hint { margin-left: auto; }

  /* ---------- 报修工具 ---------- */

  .repair-layout { display: grid; gap: 14px; }
  @media (min-width: 880px) {
    .repair-layout { grid-template-columns: 1fr 1fr; align-items: start; }
    .preview-card { position: sticky; top: 16px; }
  }

  .steps-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
  .step-dot { flex: 1; height: 4px; border-radius: 2px; background: #e9eef4; transition: background .2s; }
  .step-dot.on { background: var(--brand); }
  .step-label { font-size: 12px; color: var(--muted); white-space: nowrap; margin-left: 6px; }

  .step-tip { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }

  .fault-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 560px) { .fault-grid { grid-template-columns: repeat(3, 1fr); } }
  .fault {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: #fff;
    text-align: left;
    transition: .15s;
  }
  .fault.sel { border-color: var(--brand); background: var(--brand-weak); box-shadow: 0 0 0 3px rgba(18, 184, 134, .13); }
  .fault .f-name { font-size: 13px; font-weight: 600; }

  .wizard-foot { display: flex; gap: 10px; margin-top: 16px; }
  .wizard-foot .btn { flex: 1; }

  .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .preview-title { font-weight: 700; font-size: 14px; }
  .preview-text {
    white-space: pre-wrap;
    word-break: break-word;
    background: #f7f9fb;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.75;
    color: #3a4657;
    min-height: 150px;
    max-height: 420px;
    overflow: auto;
    user-select: text;
    -webkit-user-select: text;
  }
  .preview-text.empty { color: #a3aeba; }

  .dual-preview { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dual-preview .preview-text { font-size: 12.5px; padding: 12px; min-height: 180px; max-height: 380px; }
  .pv-label { font-size: 11.5px; font-weight: 700; color: var(--muted); margin: 0 0 6px 2px; }

  .scenario-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  /* ---------- 账单分摊 ---------- */

  .members-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mc-title { font-weight: 700; font-size: 14px; }
  .mc-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button {
    width: 34px; height: 34px; border-radius: 50%;
    background: #f2f5f8; color: #4a5768;
    font-size: 17px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .stepper .num { font-size: 20px; font-weight: 700; min-width: 30px; text-align: center; }

  .pie-wrap { height: 220px; }
  .pie-wrap canvas { display: block; margin: 0 auto; }

  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 14px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #4a5768; min-width: 0; }
  .legend-item .dot { flex: none; }
  .legend-item .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-item .lpct { color: var(--muted); margin-left: auto; flex: none; }

  .bill-share { text-align: right; font-weight: 700; font-size: 14px; color: var(--brand-dark); flex: none; }
  .bill-share small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  .del-btn {
    width: 30px; height: 30px; border-radius: 9px;
    background: #f4f7fa; color: #a3aeba;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex: none;
  }
  .del-btn:hover { color: var(--danger); background: #fdeeee; }

  .sum-card .sum-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; color: var(--muted); font-size: 14px; }
  .sum-card .sum-row b { color: var(--text); font-size: 15px; }
  .sum-card .sum-row b.brand { color: var(--brand-dark); }
  .sum-card .btn { margin-top: 12px; }

  /* ---------- 弹窗 ---------- */

  .modal { position: fixed; inset: 0; z-index: 100; display: none; }
  .modal.open { display: block; }
  .modal-mask { position: absolute; inset: 0; background: rgba(17, 24, 32, .46); animation: maskIn .2s ease; }
  @keyframes maskIn { from { opacity: 0; } }

  .modal-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fff;
    border-radius: 20px 20px 0 0;
    max-height: 88vh;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
    animation: sheetUp .24s ease;
  }
  @keyframes sheetUp { from { transform: translateY(46px); opacity: .5; } }

  @media (min-width: 640px) {
    .modal-sheet {
      left: 50%; right: auto; bottom: auto; top: 50%;
      width: 480px;
      border-radius: 20px;
      max-height: 82vh;
      animation: sheetPop .22s ease;
    }
    @keyframes sheetPop { from { transform: translate(-50%, -47%); opacity: .5; } to { transform: translate(-50%, -50%); opacity: 1; } }
    .modal-sheet { transform: translate(-50%, -50%); }
  }

  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
  .sheet-head h3 { margin: 0; font-size: 16px; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: #f2f5f8; color: #7a8798;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .sheet-body { padding: 0 18px 6px; overflow-y: auto; }
  .sheet-foot { display: flex; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--line); }
  .sheet-foot .btn { flex: 1; }

  .chip-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .facility-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    font-size: 13px; font-weight: 600;
    background: #fff;
    text-align: left;
    transition: .15s;
  }
  .facility-chip .tile { width: 26px; height: 26px; border-radius: 8px; font-size: 12px; }
  .facility-chip.sel { border-color: var(--brand); background: var(--brand-weak); }

  .detail-top { display: flex; align-items: center; gap: 12px; }
  .detail-note { font-size: 13px; color: #4a5768; background: #f7f9fb; border-radius: 10px; padding: 10px 12px; margin: 14px 0 4px; }
  .detail-note.muted { color: #a3aeba; }

  /* ---------- Toast ---------- */

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabh) + 32px + env(safe-area-inset-bottom));
    transform: translate(-50%, 10px);
    background: rgba(23, 31, 41, .93);
    color: #fff;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 13px;
    max-width: 80vw;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s, transform .22s;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="lang-switch" role="group" aria-label="Language / 语言">
      <button type="button" data-action="setLang" data-lang="zh">中文</button>
      <button type="button" data-action="setLang" data-lang="en">English</button>
    </div>
  </div>
  <section id="page-home" class="page"></section>
  <section id="page-facility" class="page"></section>
  <section id="page-repair" class="page"></section>
  <section id="page-bills" class="page"></section>
</div>

<nav class="tabbar">
  <div class="tabbar-inner">
    <a class="tab" href="#/home" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2 12 4.5l8 6.7"/><path d="M6.5 10.2v9.3h11v-9.3"/></svg>
      <span data-i18n="navHome">首页</span>
    </a>
    <a class="tab" href="#/facility" data-tab="facility">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3.5v3M15 3.5v3"/></svg>
      <span data-i18n="navFacility">设施看板</span>
    </a>
    <a class="tab" href="#/repair" data-tab="repair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      <span data-i18n="navRepair">报修工具</span>
    </a>
    <a class="tab" href="#/bills" data-tab="bills">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11v17l-2.75-1.8-2.75 1.8-2.75-1.8-2.75 1.8z"/><path d="M9.5 8.5h5M9.5 12h5"/></svg>
      <span data-i18n="navBills">账单分摊</span>
    </a>
  </div>
</nav>

<!-- 新建计划弹窗 -->
<div class="modal" id="planModal">
  <div class="modal-mask" data-close="planModal"></div>
  <div class="modal-sheet">
    <div class="sheet-head"><h3 data-i18n="modalNewPlan">新建设施计划</h3><button class="icon-btn" data-close="planModal" aria-label="关闭" data-i18n-aria="close">✕</button></div>
    <div class="sheet-body">
      <div class="field">
        <label data-i18n="chooseFacility">选择设施</label>

  function T(key, vars) {
    var pack = I18N[state.lang] || I18N.zh;
    var s = pack[key];
    if (s == null) s = I18N.zh[key];
    if (s == null) return key;
    if (vars) {
      s = s.replace(/\{(\w+)\}/g, function (m, name) {
        return vars[name] == null ? m : String(vars[name]);
      });
    }
    return s;
  }

  function isEn() { return state.lang === 'en'; }

  function applyStaticI18n() {
    document.documentElement.lang = isEn() ? 'en' : 'zh-CN';
    document.title = T('appTitle');
    $all('[data-i18n]').forEach(function (el) { el.textContent = T(el.dataset.i18n); });
    $all('[data-i18n-ph]').forEach(function (el) { el.placeholder = T(el.dataset.i18nPh); });
    $all('[data-i18n-value]').forEach(function (el) { el.dataset.value = T(el.dataset.i18nValue); });
    $all('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', T(el.dataset.i18nAria)); });
    $all('.lang-switch button').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === state.lang); });
  }

  function facById(id) {
    for (var i = 0; i < FACILITIES.length; i++) if (FACILITIES[i].id === id) return FACILITIES[i];
    return null;
  }
  function facOf(plan) { return facById(plan.facility) || FACILITIES[FACILITIES.length - 1]; }
  function facName(f) { return isEn() ? f.nameEn : f.name; }
  function facChar(f) { return isEn() ? f.charEn : f.char; }
  /* 自定义设施名称为用户输入，始终原样展示 */
  function planTitle(p) {
    var f = facOf(p);
    return p.facility === 'other' ? (p.title || facName(f)) : facName(f);
  }
  function scById(id) {
    for (var i = 0; i < SCENARIOS.length; i++) if (SCENARIOS[i].id === id) return SCENARIOS[i];
    return null;
  }
  function scName(s) { return isEn() ? s.nameEn : s.name; }
  function scChar(s) { return isEn() ? s.charEn : s.char; }
  function faultById(id) {
    for (var i = 0; i < FAULTS.length; i++) if (FAULTS[i].id === id) return FAULTS[i];
    return null;
  }
  function faultName(f) { return isEn() ? f.nameEn : f.name; }
  function faultChar(f) { return isEn() ? f.charEn : f.char; }
  /* 预填描述属于程序预置模板，跟随语言切换；英文缺失时回退中文 */
  function faultPreset(f, k) {
    if (!isEn()) return f[k] || '';
    var v = f[k + 'En'];
    return (v == null || v === '') ? (f[k] || '') : v;
  }
  function houseLine(r) {
    var b = String(r.building || '').trim();
    var u = String(r.unit || '').trim();
    if (b && u) return b + ' · ' + u;
    return b || u;
  }

  /* ================= 状态 ================= */

  function defaults() {
    return {
      lang: 'zh',
      plans: [],
      bills: [],
      members: 4,
      repair: {
        step: 1, scenario: '', building: '', unit: '', facilityId: '',
        typeId: '', type: '', location: '', symptom: '', foundAt: '', attempted: '', impact: '',
        subject: '', details: '', wantDate: '', wantSlot: ''
      }
    };
  }

  function load() {
    var d = defaults();
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return d;
      var s = JSON.parse(raw);
      if (!s || typeof s !== 'object') return d;
      if (s.lang === 'en' || s.lang === 'zh') d.lang = s.lang;
      if (Array.isArray(s.plans)) d.plans = s.plans.filter(function (p) { return p && typeof p === 'object'; });
      if (Array.isArray(s.bills)) d.bills = s.bills.filter(function (b) { return b && typeof b === 'object'; });
      if (typeof s.members === 'number' && s.members >= 1) d.members = Math.min(20, Math.floor(s.members));
      if (s.repair && typeof s.repair === 'object') {
        Object.keys(d.repair).forEach(function (k) {
          if (typeof s.repair[k] === typeof d.repair[k]) d.repair[k] = s.repair[k];
        });
        d.repair.step = Math.min(4, Math.max(1, parseInt(d.repair.step, 10) || 1));
        if (!d.repair.scenario) d.repair.step = 1;
      }
    } catch (e) { /* 数据损坏时使用默认值 */ }
    return d;
  }

  /* ================= 工具函数 ================= */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return dateStr(new Date()); }
  function fmtMoney(n) { return '$' + (Math.round((Number(n) || 0) * 100) / 100).toFixed(2); }
  function formatDateCn(d) { return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function formatDateEn(d) { return d.getDate() + ' ' + MONTHS_EN[d.getMonth()] + ' ' + d.getFullYear(); }
  function heroDate(d) {
    return isEn() ? WEEK_EN[d.getDay()] + ', ' + formatDateEn(d) : formatDateCn(d) + ' ' + WEEK[d.getDay()];
  }
  function collapse(v) { return String(v || '').trim().replace(/\s*\n+\s*/g, ' '); }

  function mdLabel(d) {
    return isEn() ? (MONTHS_EN[d.getMonth()] + ' ' + d.getDate()) : ((d.getMonth() + 1) + '/' + d.getDate());
  }

  function dayMeta(i) {
    var base = new Date(); base.setHours(0, 0, 0, 0);
    base.setDate(base.getDate() + i);
    var rel = i === 0 ? T('relToday') : (isEn() ? WEEK_EN[base.getDay()] : WEEK[base.getDay()]);
    return { str: dateStr(base), rel: rel, md: mdLabel(base), isToday: i === 0 };
  }

  function dateLabel(str) {
    for (var i = 0; i < DAYS; i++) {
      var m = dayMeta(i);
      if (m.str === str) return m.rel + ' ' + m.md;
    }
    var p = String(str).split('-');
    if (p.length === 3) {
      var dt = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
      return isEn() ? mdLabel(dt) : (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
    }
    return str;
  }

  function slotEnd(i) { return i >= SLOTS.length - 1 ? '24:00' : SLOTS[i + 1]; }
  function planSort(a, b) { return a.date === b.date ? (a.slot - b.slot) : (a.date < b.date ? -1 : 1); }
  function billsTotal() { return state.bills.reduce(function (s, b) { return s + (Number(b.amount) || 0); }, 0); }

  function locationChips() {
    return isEn()
      ? ['Kitchen', 'Bathroom', 'Bedroom', 'Living room', 'Balcony', 'Hallway']

      : ['今天上午', '今天下午', '昨天晚上', '前天晚上'];

  /* ================= Toast / 弹窗 / 复制 ================= */

  var toastTimer = null;

    var t = $('#toast');

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; })
        .catch(function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  /* ================= 路由 ================= */

  var ROUTES = ['home', 'facility', 'repair', 'bills'];

  function currentRoute() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    return ROUTES.indexOf(h) >= 0 ? h : 'home';
  }

  function render() {
    var r = currentRoute();
    applyStaticI18n();
    ROUTES.forEach(function (name) {
      var page = document.getElementById('page-' + name);
      if (page) page.classList.toggle('active', name === r);
    });
    $all('.tab').forEach(function (a) { a.classList.toggle('active', a.dataset.tab === r); });

    if (r === 'home') renderHome();
    else if (r === 'facility') renderFacility();
    else if (r === 'repair') renderRepair();
    else renderBills();

    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);

  /* ================= 首页 ================= */

  function renderHome() {
    var todoPlans = state.plans.filter(function (p) { return p.status !== 'done'; });
    var total = billsTotal();
    var per = state.members > 0 ? total / state.members : 0;
    var upcoming = state.plans.slice().filter(function (p) { return p.status !== 'done'; }).sort(planSort).slice(0, 3);
    var hour = new Date().getHours();
    var greeting = hour < 6 ? T('greetHello') : hour < 12 ? T('greetMorning') : hour < 18 ? T('greetNoon') : T('greetEvening');
    var today = new Date();

    var html = '';
    html += '<div class="hero"><h1>' + greeting + T('greetSuffix') + '</h1><p>' + heroDate(today) + ' · ' + T('heroSub') + '</p></div>';

      + '<div class="stat"><div class="v">' + todoPlans.length + '</div><div class="k">' + T('statPlans') + '</div></div>'
      + '<div class="stat"><div class="v">' + fmtMoney(total) + '</div><div class="k">' + T('statTotal') + '</div></div>'
      + '<div class="stat"><div class="v">' + fmtMoney(per) + '</div><div class="k">' + T('statPer') + '</div></div>'
      + '</div>';

    html += '<div class="quick-row">'
      + '<button class="quick" data-action="go" data-route="facility"><span class="q-icon">' + ICONS.facility + '</span>' + T('quickBook') + '</button>'
      + '<button class="quick" data-action="go" data-route="repair"><span class="q-icon">' + ICONS.repair + '</span>' + T('quickRepair') + '</button>'
      + '<button class="quick" data-action="go" data-route="bills"><span class="q-icon">' + ICONS.bills + '</span>' + T('quickBills') + '</button>'
      + '</div>';

    html += '<div class="section-title">' + T('secUpcoming') + '</div>';
    html += '<div class="card">';
    if (upcoming.length) {
      html += upcoming.map(function (p) {
        var f = facOf(p);
        return '<div class="row">'
          + '<span class="tile" style="--fc:' + f.color + '">' + facChar(f) + '</span>'
          + '<div class="row-main"><div class="row-title">' + esc(planTitle(p)) + '</div>'
          + '<div class="row-sub">' + esc(dateLabel(p.date)) + ' · ' + SLOTS[p.slot] + '–' + slotEnd(p.slot) + '</div></div>'
          + '<span class="pill todo">' + T('pillTodo') + '</span>'

      html += '<div class="empty">' + T('emptyPlans') + '</div>';
    }
    html += '</div>';

    html += '<div class="section-title">' + T('secBills') + '</div>';
    html += '<div class="card">'

      + '<div class="row-sub">' + T('localOnly') + '</div></div>'

  /* ================= 设施看板 ================= */

  function planCardHTML(p) {
    var f = facOf(p);
    var done = p.status === 'done';
    return '<div class="plan' + (done ? ' done' : '') + '" data-action="plan" data-id="' + p.id + '" style="--pc:' + f.color + '">'
      + '<div class="p-name">' + esc(planTitle(p)) + '</div>'
      + '<div class="p-time">' + SLOTS[p.slot] + '–' + slotEnd(p.slot) + (done ? ' ✓' : '') + '</div>'
      + '</div>';

  function renderFacility() {
    var page = $('#page-facility');
    var old = $('.board-scroll', page);
    var prevScroll = old ? old.scrollLeft : 0;

    var days = [];
    for (var i = 0; i < DAYS; i++) days.push(dayMeta(i));

    var outside = state.plans.filter(function (p) {
      return !days.some(function (d) { return d.str === p.date; });
    }).length;

    var html = '';
    html += '<div class="page-head"><div><h1>' + T('facilityTitle') + '</h1><p>' + T('facilitySub') + '</p></div>'
      + '<button class="btn primary sm" data-action="openPlan">' + T('newPlanBtn') + '</button></div>';

    html += '<div class="card"><div class="board-scroll"><div class="board">';
    html += '<div class="cell corner table-corner-spacer"></div>';
    days.forEach(function (d) {
      html += '<div class="cell day-head' + (d.isToday ? ' today' : '') + '"><span class="d1">' + d.rel + '</span><span class="d2">' + d.md + '</span></div>';
    });
    SLOTS.forEach(function (slot, si) {
      html += '<div class="cell time-head">' + slot + '</div>';
      days.forEach(function (d) {
        var p = null;
        for (var k = 0; k < state.plans.length; k++) {

          + (p ? planCardHTML(p) : '') + '</div>';

    html += '<div class="legend-row"><span class="lg"><i class="dot todo"></i>' + T('pillTodo') + '</span>'

  /* ---- 拖拽 ---- */

  var drag = null;
  var hlCell = null;

  document.addEventListener('pointerdown', function (e) {
    if (e.button && e.button !== 0) return;
    var card = e.target.closest ? e.target.closest('.plan') : null;
    if (!card) return;
    drag = { id: card.dataset.id, card: card, x: e.clientX, y: e.clientY, moved: false, ox: 0, oy: 0, ghost: null };
  });

  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.x) < 8 && Math.abs(e.clientY - drag.y) < 8) return;
      drag.moved = true;
      var rect = drag.card.getBoundingClientRect();
      var ghost = drag.card.cloneNode(true);
      ghost.classList.add('ghost');
      ghost.classList.remove('dragging');
      ghost.style.width = rect.width + 'px';
      ghost.style.height = rect.height + 'px';
      document.body.appendChild(ghost);
      drag.ghost = ghost;
      drag.ox = e.clientX - rect.left;
      drag.oy = e.clientY - rect.top;
      drag.card.classList.add('dragging');
      document.body.classList.add('dragging-now');
    }
    e.preventDefault();
    drag.ghost.style.transform = 'translate(' + (e.clientX - drag.ox) + 'px,' + (e.clientY - drag.oy) + 'px)';

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var cell = el && el.closest ? el.closest('.board-cell') : null;
    if (cell !== hlCell) {
      if (hlCell) hlCell.classList.remove('hl');
      if (cell) cell.classList.add('hl');
      hlCell = cell;
    }

    var sc = $('.board-scroll');
    if (sc) {
      var sr = sc.getBoundingClientRect();
      if (e.clientX < sr.left + 40) sc.scrollLeft -= 16;
      else if (e.clientX > sr.right - 40) sc.scrollLeft += 16;
    }
  }, { passive: false });

  function endDrag(e) {
    if (!drag) return;
    var d = drag;
    drag = null;
    if (hlCell) { hlCell.classList.remove('hl'); hlCell = null; }
    document.body.classList.remove('dragging-now');
    if (!d.moved) return;

    d.card.classList.remove('dragging');
    if (d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
    ui.suppressClickUntil = Date.now() + 350;

    var el = document.elementFromPoint(e.clientX, e.clientY);
    var cell = el && el.closest ? el.closest('.board-cell') : null;
    var p = state.plans.filter(function (x) { return x.id === d.id; })[0];

    if (cell && p) {
      var newDate = cell.dataset.date;
      var newSlot = parseInt(cell.dataset.slot, 10) || 0;
      if (p.date !== newDate || p.slot !== newSlot) {
        p.date = newDate;
        p.slot = newSlot;
        save();
        renderFacility();
        toast(T('toastMoved', { when: dateLabel(p.date), slot: SLOTS[p.slot] }));
        return;
      }
    }
    renderFacility();
  }

  /* 预置模板：中文草稿固定中文，英文邮件固定英文；用户填写内容原样嵌入，不做翻译 */
  function cnGreeting(r) {
    var hl = houseLine(r);
    return hl ? '您好！本人系 ' + hl + ' 住户，' : '您好！';
  }

  function cnNumbered(items) {
    return items.map(function (it, i) { return (i + 1) + '. ' + it[0] + '：' + it[1]; });
  }

  function buildCnDraft(r) {
    var lines = [];
    if (r.scenario === 'house') {
      var f = faultById(r.typeId);
      lines.push('【公寓报修申请】', '', '物业服务中心：', '');
      lines.push(cnGreeting(r) + '现就房屋设施故障报修如下：', '');
      var items = [];
      if (f) items.push(['故障类型', f.name]);
      if (r.location.trim()) items.push(['故障位置', collapse(r.location)]);
      if (r.symptom.trim()) items.push(['故障现象', collapse(r.symptom)]);
      if (r.foundAt.trim()) items.push(['首次发现时间', collapse(r.foundAt)]);
      if (r.attempted.trim()) items.push(['已尝试的排查操作', collapse(r.attempted)]);
      if (r.impact.trim()) items.push(['故障带来的影响', collapse(r.impact)]);
      lines = lines.concat(cnNumbered(items));
      lines.push('', '以上情况属实，请安排维修人员尽快上门处理。如需预约上门时间或补充信息，请随时与我联系。');
      lines.push('', '感谢！', '', '报修日期：' + formatDateCn(new Date()));
      return lines.join('\n');
    }

    if (r.scenario === 'inquiry') {
      lines.push('【物业咨询问询】', '', '物业服务中心：', '');
      lines.push(cnGreeting(r) + '想咨询以下事项：', '');
      var qi = [];
      if (r.subject.trim()) qi.push(['咨询主题', collapse(r.subject)]);
      if (r.details.trim()) qi.push(['事项说明', collapse(r.details)]);
      lines = lines.concat(cnNumbered(qi));
      lines.push('', '烦请解答，谢谢！', '', '咨询日期：' + formatDateCn(new Date()));
      return lines.join('\n');
    }

    if (r.scenario === 'moveout') {
      lines.push('【退租事项咨询】', '', '物业服务中心 / 房屋中介：', '');
      lines.push(cnGreeting(r) + '现就退租相关事宜咨询如下：', '');
      var qm = [];
      if (r.wantDate.trim()) qm.push(['期望退租时间', collapse(r.wantDate)]);
      if (r.details.trim()) qm.push(['退租事项说明', collapse(r.details)]);

      lines.push('', '烦请告知退租流程、需提前多久通知以及相关注意事项，谢谢！', '', '咨询日期：' + formatDateCn(new Date()));

  function buildEnEmail(r) {
    var subject = '';
    var purpose = '';
    var bullets = [];
    var closing = '';
    var hl = houseLine(r);

    if (r.scenario === 'house') {
      var f = faultById(r.typeId);
      subject = 'Repair Request' + (f ? ' - ' + (f.nameEn || f.name) : '') + (hl ? ' - ' + hl : '');
      purpose = 'I would like to report the following issue in my apartment:';
      if (f) bullets.push(['Type of issue', f.nameEn || f.name]);
      if (r.location.trim()) bullets.push(['Location', collapse(r.location)]);
      if (r.symptom.trim()) bullets.push(['Description', collapse(r.symptom)]);
      if (r.foundAt.trim()) bullets.push(['First noticed', collapse(r.foundAt)]);
      if (r.attempted.trim()) bullets.push(['Already tried', collapse(r.attempted)]);
      if (r.impact.trim()) bullets.push(['Impact', collapse(r.impact)]);
      closing = 'Could you please arrange for a technician to attend as soon as possible? I am happy to provide access or any further information at a time that suits your team.';
    } else if (r.scenario === 'inquiry') {
      subject = 'Property Enquiry' + (r.subject.trim() ? ' - ' + collapse(r.subject) : '') + (hl ? ' - ' + hl : '');
      purpose = 'I would like to ask about the following matter:';
      if (r.subject.trim()) bullets.push(['Subject', collapse(r.subject)]);
      if (r.details.trim()) bullets.push(['Details', collapse(r.details)]);
      closing = 'Could you please advise on this matter? Thank you for your help.';
    } else if (r.scenario === 'moveout') {
      subject = 'Move-out Enquiry' + (hl ? ' - ' + hl : '');
      purpose = 'I would like to enquire about moving out of my apartment:';
      if (r.wantDate.trim()) bullets.push(['Preferred move-out date', collapse(r.wantDate)]);
      if (r.details.trim()) bullets.push(['Details', collapse(r.details)]);
      closing = 'Could you please let me know the required notice period, the move-out process and any costs involved? Thank you for your help.';
    } else if (r.scenario === 'booking') {
      var fac = facById(r.facilityId);
      subject = 'Facility Booking Request' + (fac ? ' - ' + (fac.nameEn || fac.name) : '') + (hl ? ' - ' + hl : '');
      purpose = 'I would like to book the following facility:';
      if (fac) bullets.push(['Facility', fac.nameEn || fac.name]);
      if (r.wantDate.trim()) bullets.push(['Preferred date', collapse(r.wantDate)]);
      if (r.wantSlot.trim()) bullets.push(['Preferred time', collapse(r.wantSlot)]);
      if (r.details.trim()) bullets.push(['Additional notes', collapse(r.details)]);

    } else {

    var lines = ['Subject: ' + subject, '', 'Dear Property Manager,', ''];
    lines.push(enOpening(r, purpose));
    lines.push('');
    bullets.forEach(function (b) { lines.push('- ' + b[0] + ': ' + b[1]); });
    lines.push('', closing, '', 'Kind regards,');
    lines.push(hl ? 'Resident, ' + hl : 'Resident');
    lines.push('', formatDateEn(new Date()));
    return lines.join('\n');

  function drawPie() {
    var canvas = document.getElementById('pieCanvas');
    if (!canvas) return;
    var wrap = canvas.parentNode;
    var w = Math.max(180, wrap.clientWidth || 260);
    var h = 220;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 12;
    var items = state.bills.filter(function (b) { return (Number(b.amount) || 0) > 0; });
    var total = items.reduce(function (s, b) { return s + Number(b.amount); }, 0);

    if (!items.length || total <= 0) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#eef1f5';
      ctx.fill();
      ctx.fillStyle = '#9aa6b5';
      ctx.font = '13px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(T('canvasEmpty'), cx, cy);
      return;
    }

    var start = -Math.PI / 2;
    items.forEach(function (b) {
      var idx = state.bills.indexOf(b);
      var ang = Number(b.amount) / total * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + ang);
      ctx.closePath();
      ctx.fillStyle = BILL_COLORS[idx % BILL_COLORS.length];
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      start += ang;
    });
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-action],[data-close]') : null;
    if (!t) return;

    if (t.dataset.close) { closeModal(t.dataset.close); return; }

    var action = t.dataset.action;

    if (action === 'go') { location.hash = '#/' + t.dataset.route; return; }

    if (action === 'cell' || action === 'plan') {
      if (Date.now() < ui.suppressClickUntil) return;
      if (action === 'cell') {
        openPlanModal({ date: t.dataset.date, slot: parseInt(t.dataset.slot, 10) || 0 });
      } else {
        openPlanDetail(t.dataset.id);
      }
      return;
    }

    switch (action) {
      case 'setLang': {
        var lang = t.dataset.lang === 'en' ? 'en' : 'zh';
        if (state.lang === lang) break;
        state.lang = lang;
        save();
        render();
        break;
      }

      case 'openPlan':
        openPlanModal(null);
        break;

      case 'pickFacility':
        ui.planFacility = t.dataset.id;
        renderFacilityChips();
        $('#planCustomWrap').hidden = t.dataset.id !== 'other';
        break;

      case 'savePlan': {
        if (!ui.planFacility) { toast(T('toastPickFacility')); break; }
        var fac = FACILITIES.filter(function (f) { return f.id === ui.planFacility; })[0];
        var custom = $('#planCustomName').value.trim();
        if (ui.planFacility === 'other' && !custom) { toast(T('toastPlanName')); break; }
        state.plans.push({
          id: uid(),
          facility: ui.planFacility,
          title: ui.planFacility === 'other' ? custom : fac.name,
          date: $('#planDate').value || todayStr(),
          slot: parseInt($('#planSlot').value, 10) || 0,
          note: $('#planNote').value.trim(),
          status: 'todo'
        });
        save();
        closeModal('planModal');
        renderFacility();
        toast(T('toastPlanAdded'));
        break;
      }

      case 'planToggle': {
        var tp = state.plans.filter(function (x) { return x.id === ui.detailPlanId; })[0];
        if (!tp) break;
        tp.status = tp.status === 'done' ? 'todo' : 'done';
        save();
        closeModal('planDetailModal');
        renderFacility();
        toast(tp.status === 'done' ? T('toastPlanDone') : T('toastPlanTodo'));
        break;
      }

      case 'planDelete': {
        var dp = state.plans.filter(function (x) { return x.id === ui.detailPlanId; })[0];
        if (!dp) break;
        if (!window.confirm(T('confirmDelPlan', { name: planTitle(dp) || T('planFallback') }))) break;
        state.plans = state.plans.filter(function (x) { return x.id !== dp.id; });
        save();
        closeModal('planDetailModal');
        renderFacility();
        toast(T('toastPlanDeleted'));
        break;
      }

      case 'pickScenario': {
        var sc = scById(t.dataset.id);
        if (!sc) break;
        if (state.repair.scenario && state.repair.scenario !== sc.id) clearScenarioFields(state.repair);
        state.repair.scenario = sc.id;
        save();
        renderRepair();
        toast(T('toastPicked', { name: scName(sc) }));
        break;
      }

      case 'pickFault': {
        var f = FAULTS.filter(function (x) { return x.id === t.dataset.id; })[0];
        if (!f) break;
        var r1 = state.repair;
        r1.typeId = f.id;
        r1.type = f.name;
        ['symptom', 'attempted', 'impact'].forEach(function (k) {
          var cur = r1[k] || '';
          if (cur === '' || cur === ui.prefill[k]) {
            r1[k] = faultPreset(f, k);
            ui.prefill[k] = r1[k];
          }
        });
        save();
        renderRepair();
        toast(faultPreset(f, 'symptom') ? T('toastPickedPrefill', { name: faultName(f) }) : T('toastPicked', { name: faultName(f) }));
        break;
      }

      case 'pickRepairFacility':
        state.repair.facilityId = t.dataset.id;
        save();
        renderRepair();
        break;

      case 'chipSlot':
        state.repair.wantSlot = t.dataset.value;
        save();
        renderRepair();
        break;

      case 'chipLocation':
        state.repair.location = t.dataset.value;
        save();
        renderRepair();
        break;

      case 'chipTime':
        state.repair.foundAt = t.dataset.value;
        save();
        renderRepair();
        break;

      case 'repairNext': {
        var r2 = state.repair;
        if (r2.step === 1 && !r2.scenario) { toast(T('toastPickScenario')); break; }
        if (r2.step === 2 && !r2.unit.trim()) { ui.unitErr = true; renderRepair(); toast(T('toastNeedUnit')); break; }
        if (r2.step === 3) {
          if (r2.scenario === 'house' && !r2.symptom.trim()) { toast(T('toastNeedSymptom')); break; }
          if (r2.scenario === 'inquiry' && !r2.subject.trim()) { toast(T('toastNeedSubject')); break; }
          if (r2.scenario === 'moveout' && !r2.details.trim()) { toast(T('toastNeedDetails')); break; }
          if (r2.scenario === 'booking' && !r2.facilityId) { toast(T('toastNeedFacility')); break; }
        }
        ui.unitErr = false;
        r2.step = Math.min(4, r2.step + 1);
        save();
        renderRepair();
        break;
      }

      case 'repairPrev':
        state.repair.step = Math.max(1, state.repair.step - 1);
        save();
        renderRepair();
        break;

      case 'copyRepair': {
        if (!repairReady(state.repair)) { toast(T('toastRepairEmpty')); break; }
        copyText(buildEnEmail(state.repair)).then(function (ok) {
          toast(ok ? T('toastRepairCopied') : T('toastCopyFail'));
        });
        break;
      }

      case 'resetRepair': {
        if (hasRepairContent(state.repair) && !window.confirm(T('confirmReset'))) break;
        var fresh = defaults().repair;
        fresh.building = state.repair.building;
        fresh.unit = state.repair.unit;
        state.repair = fresh;
        ui.prefill = { symptom: '', attempted: '', impact: '' };
        ui.unitErr = false;
        save();
        renderRepair();
        toast(T('toastReset'));
        break;
      }

      case 'openBill':
        $('#billNameInput').value = '';
        $('#billAmountInput').value = '';
        $all('#billNameChips .chip').forEach(function (c) { c.classList.remove('on'); });
        openModal('billModal');
        setTimeout(function () { $('#billNameInput').focus(); }, 60);
        break;

      case 'pickBillName':
        $('#billNameInput').value = t.dataset.value;
        $all('#billNameChips .chip').forEach(function (c) { c.classList.toggle('on', c === t); });
        break;

      case 'saveBill': {
        var name = $('#billNameInput').value.trim();
        var amount = parseFloat($('#billAmountInput').value);
        if (!name) { toast(T('toastBillNeedName')); break; }
        if (!(amount > 0)) { toast(T('toastBillNeedAmount')); break; }
        state.bills.push({ id: uid(), name: name, amount: Math.round(amount * 100) / 100 });
        save();
        closeModal('billModal');
        renderBills();
        toast(T('toastBillAdded'));
        break;
      }

      case 'delBill': {
        var bill = state.bills.filter(function (b) { return b.id === t.dataset.id; })[0];
        if (!bill) break;
        if (!window.confirm(T('confirmDelBill', { name: bill.name }))) break;
        state.bills = state.bills.filter(function (b) { return b.id !== bill.id; });
        save();
        renderBills();
        toast(T('toastBillDeleted'));
        break;
      }

      case 'membersMinus':
        state.members = Math.max(1, state.members - 1);
        save();
        renderBills();
        break;

      case 'membersPlus':
        state.members = Math.min(20, state.members + 1);
        save();
        renderBills();
        break;

      case 'copyBills':
        if (!state.bills.length) { toast(T('toastBillsFirst')); break; }
        copyText(buildBillsText()).then(function (ok) {
          toast(ok ? T('toastBillsCopied') : T('toastCopyFail'));
        });
        break;
    }
  });

  document.addEventListener('input', function (e) {
    var field = e.target.dataset ? e.target.dataset.field : null;
    if (!field || !(field in state.repair)) return;
    state.repair[field] = e.target.value;
    if (field === 'unit' && ui.unitErr) {
      ui.unitErr = false;
      e.target.classList.remove('err');
    }
    saveSoon();
    updatePreview();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      $all('.modal.open').forEach(function (m) { closeModal(m.id); });
    }
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (currentRoute() === 'bills') drawPie();
    }, 150);
  });

  /* ================= 启动 ================= */

  if (!location.hash) history.replaceState(null, '', '#/home');
  render();
})();
</script>
</body>
</html>
